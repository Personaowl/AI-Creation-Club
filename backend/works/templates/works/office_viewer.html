{% load static %}
<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ title }}</title>
  <style>
    html, body, #office-frame { width: 100%; height: 100%; margin: 0; }
    body { font-family: system-ui, sans-serif; color: #243348; background: #f8f6fc; }
    #office-error { display: grid; place-items: center; min-height: 100%; margin: 0; padding: 1rem; box-sizing: border-box; }
    [hidden] { display: none !important; }
  </style>
  {% if viewer %}
    {{ viewer.config|json_script:"office-config" }}
    <script src="{{ viewer.api_url }}" defer></script>
    <script src="{% static 'works/office-viewer.js' %}" defer></script>
  {% endif %}
</head>
<body>
  <div id="office-frame" {% if not viewer %}hidden{% endif %}></div>
  <p id="office-error" role="status" {% if viewer %}hidden{% endif %}>
    {{ message|default:"无法载入演示文稿，请稍后重试。" }}
  </p>
</body>
</html>
